services:
  mongo:
    image: mongo:7
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - supportpilot-mongo:/data/db
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'mongosh --quiet --eval "try { quit(rs.status().ok ? 0 : 1) } catch (e) { rs.initiate({_id:''rs0'',members:[{_id:0,host:''mongo:27017''}]}); quit(1) }"',
        ]
      interval: 5s
      timeout: 5s
      retries: 20
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    env_file:
      - .env
    environment:
      MONGODB_URI: mongodb://mongo:27017/supportpilot-ai?replicaSet=rs0
      CLIENT_URL: http://localhost:8080
    ports:
      - "4000:4000"
    depends_on:
      mongo:
        condition: service_healthy
  client:
    build:
      context: .
      dockerfile: client/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - server

volumes:
  supportpilot-mongo:
